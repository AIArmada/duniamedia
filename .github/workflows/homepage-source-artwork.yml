name: Store verified source artwork
on:
  push:
    branches: [fix/homepage-visual-fidelity]
    paths: ['.github/workflows/homepage-source-artwork.yml']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils python3-pil
      - name: Extract selected originals only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, tempfile
          from PIL import Image, ImageEnhance
          selected = [
              ('podcast-utama-buletin-tv3','image-025.jpg','tv3-newsroom.webp',1.45),
              ('podcast-utama-buletin-tv3','image-154.jpg','tv3-podcast.webp',1.0),
              ('sinar-karangkraf-ratecard-2025-2026','image-000.ppm','sinar-editorial.webp',1.0),
          ]
          for slug, name, output, brightness in selected:
              with tempfile.TemporaryDirectory() as tmp:
                  subprocess.run(['pdfimages','-j',f'storage/app/private/ratecards/{slug}.pdf',str(Path(tmp)/'image')],check=True)
                  im=Image.open(Path(tmp)/name).convert('RGB')
                  im.thumbnail((1000,750))
                  if brightness != 1.0:
                      im=ImageEnhance.Brightness(im).enhance(brightness)
                  im.save(Path('public/assets/home')/output, 'WEBP', quality=90)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/home/
          git rm -r storage/app/private/homepage-artwork-review/
          git rm .github/workflows/homepage-source-artwork.yml
          git commit -m 'Add selected broadcaster artwork and remove temporary extraction workflow'
          git push origin HEAD:fix/homepage-visual-fidelity
