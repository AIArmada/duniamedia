name: Render redesigned pages
on:
  push:
    branches: [audit/redesigned-page-quality]
    paths: ['.github/workflows/redesign-visual-review.yml']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Commerce packages
        run: git clone --depth 1 https://github.com/AIArmada/commerce.git ../commerce
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, gd, intl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install application and build assets
        run: |
          mkdir -p bootstrap/cache storage/framework/{cache/data,sessions,views} storage/logs
          cp .env.example .env
          sed -i 's|^APP_URL=.*|APP_URL=http://127.0.0.1:8000|' .env
          composer install --prefer-dist --no-interaction --no-progress
          npm ci --ignore-scripts
          npm run build
      - name: Prepare isolated seeded review database
        env:
          ADMIN_PASSWORD: review-only-password
        run: |
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --seed --force
          php artisan storage:link
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/dunia-server.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8000 && break; sleep 1; done
      - name: Capture actual browser renders
        run: |
          mkdir -p /tmp/dunia-browser
          npm install --prefix /tmp/dunia-browser --no-save playwright
          /tmp/dunia-browser/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p /tmp/dunia-screenshots
          cat > /tmp/dunia-browser/capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const browser = await chromium.launch({headless:true});
          const routes = {home:'/',about:'/about',contact:'/contact',work:'/work',media:'/media',creators:'/creators',solutions:'/solutions',plans:'/campaign-plans',advisor:'/media-advisor',proposal:'/quote-builder',rates:'/rates',owners:'/media/owners',hotfm:'/media/owners/media-prima/hot-fm',search:'/search?q=Hot+FM'};
          const report = [];
          for (const [name, path] of Object.entries(routes)) {
            for (const width of [1440,390]) {
              const context = await browser.newContext({viewport:{width,height:900},deviceScaleFactor:1});
              const page = await context.newPage();
              const errors = [];
              page.on('pageerror', e=>errors.push(e.message));
              try {
                const response = await page.goto('http://127.0.0.1:8000'+path,{waitUntil:'domcontentloaded',timeout:30000});
                await page.evaluate(()=>document.fonts.ready);
                await page.evaluate(()=>{document.querySelectorAll('img[loading="lazy"]').forEach(i=>i.loading='eager')});
                await page.evaluate(async()=>{await Promise.race([Promise.allSettled([...document.images].map(i=>i.decode())),new Promise(r=>setTimeout(r,10000))])});
                await page.evaluate(async()=>{for(let y=0;y<document.documentElement.scrollHeight;y+=800){window.scrollTo(0,y);await new Promise(r=>setTimeout(r,50))}window.scrollTo(0,0)});
                await page.waitForTimeout(350);
                await page.screenshot({path:'/tmp/dunia-screenshots/'+name+'-'+width+'-top.jpg',type:'jpeg',quality:75,animations:'disabled'});
                await page.screenshot({path:'/tmp/dunia-screenshots/'+name+'-'+width+'.jpg',fullPage:true,type:'jpeg',quality:65,animations:'disabled',timeout:30000});
                report.push({name,width,status:response?.status(),title:await page.title(),errors, ...(await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,viewport:innerWidth,brokenImages:[...document.images].filter(i=>!i.complete||!i.naturalWidth).map(i=>i.getAttribute('src'))})))});
              } catch(e) { report.push({name,width,error:e.message,errors}); }
              await context.close();
            }
          }
          // Exercise stateful tools with the isolated seeded catalogue.
          const context = await browser.newContext({viewport:{width:1440,height:900}});
          const page = await context.newPage();
          try {
            await page.goto('http://127.0.0.1:8000/media-advisor');
            await page.getByRole('button',{name:'Generate strategy',exact:false}).first().click();
            await page.waitForTimeout(2200);
            await page.screenshot({path:'/tmp/dunia-screenshots/advisor-generated.jpg',fullPage:true,type:'jpeg',quality:70});
            report.push({name:'advisor-generated',title:await page.title(),regenerate:await page.getByText('Regenerate strategy',{exact:true}).count()});
          } catch(e) {report.push({name:'advisor-generated',error:e.message});}
          try {
            await page.goto('http://127.0.0.1:8000/rates');
            await page.getByRole('button',{name:'Compare',exact:true}).nth(0).click();
            await page.waitForTimeout(500);
            await page.getByRole('button',{name:'Compare',exact:true}).first().click();
            await page.waitForTimeout(500);
            await page.getByRole('button',{name:'Compare now',exact:true}).click();
            await page.waitForTimeout(700);
            await page.screenshot({path:'/tmp/dunia-screenshots/rates-compared.jpg',fullPage:true,type:'jpeg',quality:70});
            report.push({name:'rates-compared',comparison:await page.getByRole('heading',{name:'Compare placements'}).count()});
          } catch(e) {report.push({name:'rates-compared',error:e.message});}
          await context.close();
          await browser.close();
          await writeFile('/tmp/dunia-screenshots/report.json',JSON.stringify(report,null,2));
          JS
          node /tmp/dunia-browser/capture.mjs
          cat /tmp/dunia-screenshots/report.json
      - name: Store temporary review screenshots on separate branch
        if: success()
        run: |
          git switch --orphan audit/redesign-browser-renders-final
          mkdir -p renders
          cp /tmp/dunia-screenshots/* renders/
          git add renders/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Temporary browser render review'
          git push origin HEAD:audit/redesign-browser-renders-final
      - name: Server log
        if: failure()
        run: tail -80 /tmp/dunia-server.log || true
