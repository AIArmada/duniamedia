name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Architecture boundaries
        run: composer arch:boundaries

      - name: Ownership and static analysis (app, routes, seeders)
        run: composer arch:writes

      - name: Static analysis (Larastan baseline)
        run: composer analyse

      - name: Tests
        run: php artisan test --compact
