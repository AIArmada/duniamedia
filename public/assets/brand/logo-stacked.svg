<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 1020"><title id="title">Dunia Media — stacked logo</title><desc id="desc">Plum, magenta, and muted champagne-gold lowercase d with play icon above the outlined duniamedia wordmark</desc><defs>
