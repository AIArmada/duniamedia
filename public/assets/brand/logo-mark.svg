<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 600 740"><title id="title">Dunia Media symbol</title><desc id="desc">Lowercase d ribbon in magenta, plum, and soft gold with a white play triangle</desc><defs>
  <linearGradient id="plumCore" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#50003A"/><stop offset=".52" stop-color="#79034F"/><stop offset="1" stop-color="#9B075E"/></linearGradient>
  <linearGradient id="magentaArc" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F73A99"/><stop offset=".46" stop-color="#DF0978"/><stop offset="1" stop-color="#9A075B"/></linearGradient>
  <linearGradient id="magentaStem" x1=".1" y1=".2" x2="1" y2=".88"><stop stop-color="#F82E88"/><stop offset=".50" stop-color="#CC085F"/><stop offset="1" stop-color="#81024A"/></linearGradient>
  <linearGradient id="goldFold" x1="0" y1="0" x2=".92" y2="1"><stop stop-color="#C77951"/><stop offset=".42" stop-color="#EAB184"/><stop offset=".72" stop-color="#F4C695"/><stop offset="1" stop-color="#D98762"/></linearGradient>
  <linearGradient id="goldBase" x1="0" y1=".8" x2="1" y2=".2"><stop stop-color="#B75F51"/><stop offset=".27" stop-color="#D78669"/><stop offset=".74" stop-color="#F4BE89"/><stop offset="1" stop-color="#E3A172"/></linearGradient>
  <linearGradient id="wordPlum" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="350" y2="0"><stop stop-color="#50003A"/><stop offset="1" stop-color="#6E044D"/></linearGradient>
  <linearGradient id="wordMedia" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="655" y2="0"><stop stop-color="#C60569"/><stop offset=".65" stop-color="#DF106A"/><stop offset="1" stop-color="#E6A270"/></linearGradient>
</defs><g id="duniamedia-mark">
