  <!-- Dark inner bowl - restrained shadow gives depth but remains logo-friendly -->
  <path fill="url(#plumCore)" d="M36 450C62 368 133 307 204 297C268 288 325 324 365 369L383 465C327 510 263 530 193 584C158 612 143 636 151 660C63 616 27 532 36 450Z"/>
  <!-- Main vertical ribbon and lower crossover -->
  <path fill="url(#magentaStem)" d="M360 221C361 160 375 133 418 103C455 77 491 64 518 87C530 98 540 118 540 148V388C540 457 521 501 467 534C418 562 345 585 279 610C214 635 170 649 151 660C155 623 189 587 253 556C318 526 389 501 446 464C487 439 497 409 498 362V176C453 207 398 240 366 299Z"/>
  <!-- Folded edge along upper mast: matte champagne gold, no hard chrome highlights -->
  <path fill="url(#goldFold)" d="M359 299V176C359 137 368 114 400 90C434 64 481 35 506 40C525 43 540 61 540 87C540 127 498 155 449 186C397 218 370 240 359 299Z"/>
  <!-- Front lower golden ribbon -->
