  <path d="M154 658C211 596 341 553 443 502C507 471 532 435 539 391" fill="none" stroke="#F5CEA6" stroke-width="1.65" stroke-linecap="round" opacity=".65"/>
  <path d="M360 293C369 242 401 209 451 179C493 154 533 125 539 91" fill="none" stroke="#F7D7B3" stroke-width="1.2" stroke-linecap="round" opacity=".55"/>
  <!-- Clear central play symbol -->
  <path fill="#FFFFFF" d="M253 365C244 359 235 358 227 362C218 367 216 375 216 385V489C216 507 231 518 247 510L340 456C353 448 354 430 340 422Z"/>
</g></svg>