  <path fill="url(#plumCore)" d="M365 202C295 168 209 185 141 230C61 283 28 365 36 460C43 558 111 642 213 680C309 715 413 675 479 602C519 557 540 501 540 436L540 90C540 57 520 39 495 41C461 45 408 80 389 95C367 112 359 138 359 170Z"/>
